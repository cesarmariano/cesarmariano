<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <title>Finanzas familiares</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-back" class="icon-btn" aria-label="Volver" hidden>&larr;</button>
    <img src="icons/icon-192.png" alt="" class="topbar-logo">
    <h1 id="title">Finanzas</h1>
    <button id="btn-sync" class="icon-btn" aria-label="Sincronizar con Google Drive" hidden>&#9729;</button>
    <button id="btn-settings" class="icon-btn" aria-label="Ajustes">&#9881;</button>
  </header>

  <main id="view"></main>

  <nav id="bottom-nav" aria-label="Secciones">
    <button data-sec="mes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Mes
    </button>
    <button data-sec="tarjetas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 10h20M6 15h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Tarjetas
    </button>
    <button data-sec="ahorro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-5 4 4 7-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 9h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Ahorro
    </button>
    <button data-sec="anio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Año
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/jspdf.plugin.autotable.min.js"></script>
  <script src="lib/pdf.min.js"></script>
  <script src="version.js"></script>
  <script src="config.js"></script>
  <script src="datos.js"></script>
  <script src="drive.js"></script>
  <script src="app.js"></script>
  <script src="tarjetas.js"></script>
  <script src="ahorro.js"></script>
  <script src="ajustes.js"></script>
  <script src="main.js"></script>
</body>
</html>
