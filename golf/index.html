<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Golf">
  <title>Mi Golf</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-back" class="icon-btn" aria-label="Volver" hidden>&larr;</button>
    <img src="icons/icon-192.png" alt="" class="topbar-logo">
    <h1 id="title">Mi Golf</h1>
    <button id="btn-sync" class="icon-btn" aria-label="Sincronizar con Google Drive" hidden>&#9729;</button>
    <button id="btn-settings" class="icon-btn" aria-label="Ajustes">&#9881;</button>
  </header>

  <main id="view"></main>

  <nav id="bottom-nav" aria-label="Secciones">
    <button data-sec="rondas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21V3l10 4-10 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><ellipse cx="12" cy="21" rx="8" ry="1.5" fill="currentColor"/></svg>
      Rondas
    </button>
    <button data-sec="analisis">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Análisis
    </button>
    <button data-sec="consejos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Consejos
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="version.js"></script>
  <script src="config.js"></script>
  <script src="consejos-base.js"></script>
  <script src="puntaje.js"></script>
  <script src="drive.js"></script>
  <script src="datos.js"></script>
  <script src="graficos.js"></script>
  <script src="audio.js"></script>
  <script src="ia.js"></script>
  <script src="app.js"></script>
  <script src="analisis.js"></script>
  <script src="consejos.js"></script>
  <script src="ajustes.js"></script>
  <script src="main.js"></script>
</body>
</html>
