<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1f63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alveon">
  <title>Alveon – Médicos y pacientes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-back" class="icon-btn" aria-label="Volver" hidden>&larr;</button>
    <img src="icons/icon-192.png" alt="" class="topbar-logo">
    <h1 id="title">Visitas a médicos</h1>
    <button id="btn-sync" class="icon-btn" aria-label="Sincronizar con Google Drive" hidden>&#9729;</button>
    <button id="btn-settings" class="icon-btn" aria-label="Ajustes">&#9881;</button>
  </header>

  <main id="view"></main>

  <nav id="bottom-nav" aria-label="Secciones">
    <button data-sec="medicos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v6a4 4 0 0 0 8 0V3M10 13v2a5 5 0 0 0 10 0v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Médicos
    </button>
    <button data-sec="pacientes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Pacientes
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/jspdf.plugin.autotable.min.js"></script>
  <script src="version.js"></script>
  <script src="config.js"></script>
  <script src="drive.js"></script>
  <script src="app.js"></script>
  <script src="pacientes.js"></script>
  <script src="main.js"></script>
</body>
</html>
